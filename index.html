<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better xCloud</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b0f0c; color: #e8ffe8; overflow: hidden;
      font-family: "Samsung One", "Segoe UI", Arial, sans-serif;
      cursor: default;
    }
    #wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 0 80px;
    }
    #logo { font-size: 72px; font-weight: 800; letter-spacing: -2px; }
    #logo span { color: #8ee06a; }
    #bar {
      width: 420px; height: 4px; margin: 34px 0 30px;
      background: #1c2a1e; border-radius: 4px; overflow: hidden;
    }
    #spinner {
      width: 100%; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #8ee06a 0%, #4fa832 50%, #8ee06a 100%);
      background-size: 300% 100%; animation: slide 1.4s linear infinite;
    }
    @keyframes slide { 0% { background-position: 0% 0; } 100% { background-position: -300% 0; } }
    #status { font-size: 30px; font-weight: 600; }
    #sub { font-size: 20px; color: #9db39d; margin-top: 10px; max-width: 1100px; word-break: break-all; }
    #hint {
      position: absolute; bottom: 46px; left: 0; right: 0;
      text-align: center; font-size: 19px; color: #6d806d;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="logo">Better <span>xCloud</span></div>
    <div id="bar"><div id="spinner"></div></div>
    <div id="status">Iniciando...</div>
    <div id="sub"></div>
  </div>
  <div id="hint"></div>
  <script src="app.js"></script>
</body>
</html>
